server:
  port: 8080

spring:
  application:
    name: gamenews
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gamenews}
    username: ${DB_USER:gamenews}
    password: ${DB_PASSWORD:gamenews}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
    info:
      enabled: true
  server:
    port: ${MANAGEMENT_PORT:8081}

# CORS 설정을 위해 application.yml에 추가
cors:
  allowed-origins: ${ALLOWED_ORIGIN}, http://localhost:3000
